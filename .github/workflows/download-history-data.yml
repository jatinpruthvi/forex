name: Download M5 history data

# Downloads 4 years of M5 OHLCV for 11 FX pairs and uploads the CSVs as an artifact.
#
# The official Dukascopy datafeed rate-limits GitHub-hosted runners (HTTP 429 for
# every request from Azure datacenter IPs), so this workflow uses the same sources
# as the proven local pipeline:
#   1. ForexSB Dukascopy mirror  -> latest ~200k M5 bars per pair (recent segment)
#   2. histdata.com M1 ASCII zips -> 2022-09-11 up to the mirror start (gap segment)
#   3. Aggregate M1 -> M5, assemble both segments, trim DST-transition artifacts
#   4. Validate the final CSVs (structural + spot checks vs official API)
#
# No credentials are needed; the workflow is fully self-contained and resumable
# via the actions/cache copy of the downloaded raw zips.
#
# Besides the (blob-storage) artifact, the finished CSVs are published to the
# data/m5-history branch as *.csv.gz + validation-report.txt + MANIFEST.txt.
# Git hosts (github.com / codeload.github.com) are reachable from restricted
# sandboxes where Azure blob storage is blocked, so consumers can fetch the
# data with:  curl -L https://codeload.github.com/<owner>/<repo>/tar.gz/refs/heads/data/m5-history

on:
  workflow_dispatch:
    inputs:
      skip_validation:
        description: Skip the validation step (spot checks hit the Dukascopy JSON API)
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: history-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    name: Download, assemble and validate M5 CSVs
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        working-directory: scripts/history-data/dukascopy-node

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependency for the histdata gap fill
        run: python -m pip install -r requirements-histdata.txt

      - name: Restore downloaded histdata zips (resumable cache)
        uses: actions/cache/restore@v6
        with:
          path: scripts/history-data/histdata-cache
          key: histdata-zips-ubuntu
          restore-keys: |
            histdata-zips-

      # ---- Step 1: recent segment from the ForexSB Dukascopy mirror ----------
      - name: Fetch mirror segment (latest 200k M5 bars per pair)
        run: node fetch-fsb-all.js

      # ---- Step 2: gap segment from histdata.com (yearly M1 zips) ------------
      - name: Fill gap segment from histdata.com
        run: node fill-gap-histdata.js

      - name: Save histdata zips to cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: scripts/history-data/histdata-cache
          key: histdata-zips-ubuntu-${{ github.run_id }}

      # ---- Step 3: assemble + trim -------------------------------------------
      - name: Assemble final CSVs and trim DST-transition artifacts
        run: |
          node assemble-4y.js
          node trim-dst-hours.js

      # ---- Step 4: validate ---------------------------------------------------
      - name: Validate final CSVs
        if: ${{ inputs.skip_validation != true }}
        run: node validate-m5.js

      - name: Summarize output
        if: always()
        run: |
          echo "## M5 history data download" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la ../m5-data/*.csv 2>/dev/null || echo "no CSVs produced" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ../m5-data/validation-report.txt ]; then
            echo "### Validation report" >> "$GITHUB_STEP_SUMMARY"
            tail -40 ../m5-data/validation-report.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload completed CSVs as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m5-history-${{ github.run_id }}
          path: |
            scripts/history-data/m5-data/*.csv
            scripts/history-data/m5-data/validation-report.txt
          if-no-files-found: warn
          retention-days: 14

      # ---- Step 5: publish to data/m5-history (git hosts only; no blob storage) ----
      - name: Publish CSV snapshot to the data/m5-history branch
        if: always()
        shell: bash
        working-directory: scripts/history-data/m5-data
        run: |
          set -e
          shopt -s nullglob
          csvs=( *.csv )
          if [ ${#csvs[@]} -eq 0 ]; then
            echo "No CSVs produced; nothing to publish."
            exit 0
          fi

          # Manifest with per-pair stats - checkable without unzipping any data
          {
            echo "# M5 history data manifest"
            echo "generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            printf '%-10s %10s  %-17s  %-17s\n' pair rows first last
            for f in "${csvs[@]}"; do
              pair="${f%%-*}"
              rows=$(($(wc -l < "$f") - 1))
              first=$(sed -n '2p' "$f" | cut -d, -f1)
              last=$(tail -n 1 "$f" | cut -d, -f1)
              printf '%-10s %10s  %-17s  %-17s\n' "$pair" "$rows" \
                "$(date -u -d "@$((first / 1000))" '+%Y-%m-%d %H:%M')" \
                "$(date -u -d "@$((last / 1000))" '+%Y-%m-%d %H:%M')"
            done
          } > MANIFEST.txt
          cat MANIFEST.txt >> "$GITHUB_STEP_SUMMARY"

          gzip -kf "${csvs[@]}"   # keeps *.csv, adds *.csv.gz

          repo_url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          work="${RUNNER_TEMP}/data-branch"
          rm -rf "$work"
          if git ls-remote --heads "$repo_url" data/m5-history | grep -q data/m5-history; then
            git clone -q --depth 1 --single-branch --branch data/m5-history "$repo_url" "$work"
          else
            git init -q -b data/m5-history "$work"
          fi
          cd "$work"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$GITHUB_WORKSPACE/scripts/history-data/m5-data/"*.csv.gz .
          cp "$GITHUB_WORKSPACE/scripts/history-data/m5-data/validation-report.txt" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/scripts/history-data/m5-data/MANIFEST.txt" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "M5 history snapshot from run ${GITHUB_RUN_ID} ($(date -u '+%Y-%m-%d %H:%MZ'))"
          git push -q --force origin data/m5-history
          echo "Published snapshot of ${#csvs[@]} pairs to the data/m5-history branch."
