name: Download M5 history data

# Downloads 4 years of M5 OHLCV for 11 FX pairs and uploads the CSVs as an artifact.
#
# The official Dukascopy datafeed rate-limits GitHub-hosted runners (HTTP 429 for
# every request from Azure datacenter IPs), so this workflow uses the same sources
# as the proven local pipeline:
#   1. ForexSB Dukascopy mirror  -> latest ~200k M5 bars per pair (recent segment)
#   2. histdata.com M1 ASCII zips -> 2022-09-11 up to the mirror start (gap segment)
#   3. Aggregate M1 -> M5, assemble both segments, trim DST-transition artifacts
#   4. Validate the final CSVs (structural + spot checks vs official API)
#
# No credentials are needed; the workflow is fully self-contained and resumable
# via the actions/cache copy of the downloaded raw zips.

on:
  workflow_dispatch:
    inputs:
      skip_validation:
        description: Skip the validation step (spot checks hit the Dukascopy JSON API)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: history-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    name: Download, assemble and validate M5 CSVs
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: scripts/history-data/dukascopy-node

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependency for the histdata gap fill
        run: python -m pip install -r requirements-histdata.txt

      - name: Restore downloaded histdata zips (resumable cache)
        uses: actions/cache/restore@v4
        with:
          path: scripts/history-data/histdata-cache
          key: histdata-zips-ubuntu
          restore-keys: |
            histdata-zips-

      # ---- Step 1: recent segment from the ForexSB Dukascopy mirror ----------
      - name: Fetch mirror segment (latest 200k M5 bars per pair)
        run: node fetch-fsb-all.js

      # ---- Step 2: gap segment from histdata.com (yearly M1 zips) ------------
      - name: Fill gap segment from histdata.com
        run: node fill-gap-histdata.js

      - name: Save histdata zips to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/history-data/histdata-cache
          key: histdata-zips-ubuntu-${{ github.run_id }}

      # ---- Step 3: assemble + trim -------------------------------------------
      - name: Assemble final CSVs and trim DST-transition artifacts
        run: |
          node assemble-4y.js
          node trim-dst-hours.js

      # ---- Step 4: validate ---------------------------------------------------
      - name: Validate final CSVs
        if: ${{ inputs.skip_validation != true }}
        run: node validate-m5.js

      - name: Summarize output
        if: always()
        run: |
          echo "## M5 history data download" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la ../m5-data/*.csv 2>/dev/null || echo "no CSVs produced" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ../m5-data/validation-report.txt ]; then
            echo "### Validation report" >> "$GITHUB_STEP_SUMMARY"
            tail -40 ../m5-data/validation-report.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload completed CSVs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-history-${{ github.run_id }}
          path: |
            scripts/history-data/m5-data/*.csv
            scripts/history-data/m5-data/validation-report.txt
          if-no-files-found: error
          retention-days: 14
